[project]
name = "festival-game"
version = "0.1.0"
description = "En nat i Lejet: a 3D festival game built on top of the Festival Architect planner (team project, Nova SBE 2026/27)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.62.0",
    "pytest==9.1.1",
    "psycopg[binary]==3.2.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
